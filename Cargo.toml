[workspace]
members = [
  "crates/webinterface-protocol",
  "crates/webinterface-recording",
  "crates/webinterface-core",
  "crates/webinterface-assets",
  "crates/webinterface-crashpilot-bridge",
  "crates/webinterface-dehumanized-schema",
  "crates/interfaabs",
  "xtask",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0"

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1"
axum = { version = "0.8", features = ["ws"] }
bytes = "1.10"
crc32fast = "1.4"
futures-util = "0.3"
http = "1"
mime_guess = "2"
parking_lot = "0.12"
prost = "0.14"
prost-types = "0.14"
rmp-serde = "1.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1.47", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = "0.27"
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
uuid = { version = "1", features = ["serde", "v4"] }
zstd = "0.13"
