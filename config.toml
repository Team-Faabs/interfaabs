[server]
host = "0.0.0.0"
port = 8080

[crashpilot]
# CrashPilot websocket endpoint used for commands and vision/tracked streaming.
ws_url = "ws://10.0.64.221:4096/ws"
reconnect_delay_ms = 2000
handshake_timeout_ms = 10000
write_timeout_ms = 2000

[interface_defaults]
# Active mode CrashPilot should run: MODE_MANUAL, MODE_GAME or MODE_TEST
mode = "MODE_MANUAL"
# Field side: false for x+, true for x-
side = false
# Team color: false for Yellow, true for Blue
team_color = false

[interface_defaults.manual]
enable_testfield = false
testfield = 0
ball_tracked = true
gc_data = false

[interface_defaults.game]
# Whether the game is running: true to start, false to stop
running = false
# Robot id that should act as goalkeeper
goalkeeper_id = 0
# Max speed for the game in mm/s, 0 for unlimited
max_speed = 0

[interface_defaults.test]
# Test to run: TEST_NONE, TEST_BALL_CONTROL, TEST_DRIBBLER or TEST_KICKER
test = "TEST_NONE"
# Robot ids that participate in the test
robot_ids = []

[field]
# Fallback field geometry used until SSL geometry arrives from the controller.
length_mm = 9000
width_mm = 6000
goal_width_mm = 1000
goal_depth_mm = 180
boundary_width_mm = 300
penalty_area_depth_mm = 1000
penalty_area_width_mm = 2000
center_circle_radius_mm = 500
line_thickness_mm = 10
max_robot_radius_mm = 90
ball_radius_mm = 22
